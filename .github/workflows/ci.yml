name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact_scope:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 5
    outputs:
      run_core: ${{ steps.select.outputs.run_core }}
      run_e2e: ${{ steps.select.outputs.run_e2e }}
      run_db: ${{ steps.select.outputs.run_db }}
    steps:
      - name: Checkout diff for audited CI scope
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select impacted suites (fail closed on unknown dependencies)
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            python3 scripts/ci-impact-selection.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci-impact-selection.py --force-full --github-output "$GITHUB_OUTPUT"
          fi
      - name: Verify CI impact-selection regressions
        run: python3 -m unittest tests.test_ci_impact_selection -v

  lint:
    needs: impact_scope
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && always())
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enforce successful CI impact classification (required lint context)
        env:
          SCOPE_RESULT: ${{ needs.impact_scope.result }}
        shell: bash
        run: test "$SCOPE_RESULT" = success

      - name: Isolate npm cache per runner
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - name: Use Node 24.19.0
        if: needs.impact_scope.outputs.run_core == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        if: needs.impact_scope.outputs.run_core == 'true'
        run: npm ci
      - name: Lint
        if: needs.impact_scope.outputs.run_core == 'true'
        run: npm run lint

  typecheck:
    needs: impact_scope
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       needs.impact_scope.outputs.run_core == 'true')
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Isolate npm cache per runner
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - name: Use Node 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  unit:
    needs: impact_scope
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       needs.impact_scope.outputs.run_core == 'true')
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Isolate npm cache per runner
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - name: Use Node 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:run
      - name: Managed staging backup provenance regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_managed_backup_evidence.py' -v
          python3 -m unittest discover -s tests -p 'test_backup_source_guard.py' -v
      - name: Staging Python security regressions (fail closed)
        run: python3 -m unittest discover -s tests -p 'test_staging_*.py' -v

  architecture:
    needs: impact_scope
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       needs.impact_scope.outputs.run_core == 'true')
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Isolate npm cache per runner
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - name: Use Node 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Architecture dependency contracts
        run: npm run arch:check
      - name: Module contracts
        run: npm run modules:check
      - name: Environment isolation assertion
        env:
          APP_ENV: local
          WHATSAPP_LIVE_ENABLED: false
          EMAIL_LIVE_ENABLED: false
          NFSE_LIVE_ENABLED: false
        run: npm run environment:check

  build:
    needs: impact_scope
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       needs.impact_scope.outputs.run_core == 'true')
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Isolate npm cache per runner
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - name: Use Node 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify lockfile is reproducible
        run: git diff --exit-code -- package-lock.json
      - name: Build
        run: npm run build
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: impact_scope
    concurrency:
      group: solange-local-supabase
      cancel-in-progress: false
      queue: max
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       needs.impact_scope.outputs.run_e2e == 'true')
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Isolate Playwright browser cache per CI attempt
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/solange-playwright-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}" >> "$GITHUB_ENV"
      - name: Isolate npm cache per runner
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - name: Use Node 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Start and reset isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/supabase-start.log" "$RUNNER_TEMP/supabase-start-retry.log" "$RUNNER_TEMP/supabase-start-reset-retry.log"' EXIT
          if docker ps -a --format '{{.Names}}' | grep -q '_solange-rolla-consultorio$'; then
            npx supabase@2.118.0 stop --no-backup
          else
            echo "No local Supabase stack to stop."
          fi
          # Docker may release a stopped container port asynchronously.
          python3 scripts/ci_wait_port_release.py --timeout 120 54322
          if ! npx supabase@2.118.0 start >"$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "::warning::Local Supabase failed initial health check; retrying once after cleanup."
            npx supabase@2.118.0 stop --no-backup || true
            python3 scripts/ci_wait_port_release.py --timeout 120 54322
            sleep 5
            npx supabase@2.118.0 start >"$RUNNER_TEMP/supabase-start-retry.log" 2>&1
          fi
          if ! npx supabase@2.118.0 db reset; then
            echo "::warning::Isolated local Supabase reset failed; rebuilding only the CI local stack once."
            npx supabase@2.118.0 stop --no-backup
            python3 scripts/ci_wait_port_release.py --timeout 120 54322
            sleep 5
            npx supabase@2.118.0 start >"$RUNNER_TEMP/supabase-start-reset-retry.log" 2>&1
            npx supabase@2.118.0 db reset
          fi
          rm -f "$RUNNER_TEMP/supabase-start.log" "$RUNNER_TEMP/supabase-start-retry.log" "$RUNNER_TEMP/supabase-start-reset-retry.log"
          trap - EXIT
      - name: Prepare local E2E environment
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r key value; do
            case "$key" in
              API_URL|DB_URL|PUBLISHABLE_KEY|SECRET_KEY)
                value="${value#\"}"
                value="${value%\"}"
                printf -v "$key" '%s' "$value"
                export "$key"
                ;;
            esac
          done < <(npx supabase@2.118.0 status -o env)
          test -n "$API_URL" && test -n "$DB_URL" && test -n "$PUBLISHABLE_KEY" && test -n "$SECRET_KEY"
          {
            echo "DB_URL=$DB_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "APP_URL=http://127.0.0.1:3000"
            echo "APP_ENV=local"
            echo "NEXT_PUBLIC_TEMP_ADMIN_LOGIN_ENABLED=true"
            echo "WHATSAPP_LIVE_ENABLED=false"
            echo "EMAIL_LIVE_ENABLED=false"
            echo "NFSE_LIVE_ENABLED=false"
            echo "CLINICAL_ENCRYPTION_ACTIVE_VERSION=1"
            echo "CLINICAL_ENCRYPTION_KEY_V1=$(printf 'solange-ci-local-e2e-key-0000001' | base64 -w0)"
            echo "RATE_LIMIT_HMAC_KEY=solange-ci-local-rate-limit-key-32-bytes"
            echo "PUBLIC_ACTION_HMAC_KEY=solange-ci-local-public-action-key-32-bytes"
            echo "DEMO_LOCAL_EMAIL=demo.owner@solange.invalid"
            echo "DEMO_LOCAL_PASSWORD=DemoLocalOnly!2026"
          } >> "$GITHUB_ENV"
      - name: Build application
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Verify isolated Chromium executable
        shell: bash
        run: |
          set -euo pipefail
          browser="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          if [ ! -x "$browser" ]; then
            echo "::error::Playwright Chromium executable missing after install in the isolated cache"
            exit 1
          fi
      - name: End-to-end tests
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/solange-e2e-server.log"
          E2E_SERVER_PID=''
          cleanup_server() {
            if [ -n "$E2E_SERVER_PID" ] && kill -0 "$E2E_SERVER_PID" 2>/dev/null; then
              kill -TERM -- "-$E2E_SERVER_PID" 2>/dev/null || true
              wait "$E2E_SERVER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup_server EXIT
          started=false
          for attempt in 1 2 3 4 5; do
            E2E_PORT="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
            test -n "$E2E_PORT"
            export E2E_PORT
            export APP_URL="http://127.0.0.1:$E2E_PORT"
            : > "$LOG"
            setsid npm run start -- --hostname 127.0.0.1 --port "$E2E_PORT" >"$LOG" 2>&1 &
            E2E_SERVER_PID=$!
            for _ in $(seq 1 60); do
              if curl -fsS "$APP_URL/api/health" >/dev/null 2>&1; then
                started=true
                break
              fi
              if ! kill -0 "$E2E_SERVER_PID" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            if [ "$started" = true ]; then
              break
            fi
            cleanup_server
            E2E_SERVER_PID=''
            sleep 1
          done
          if [ "$started" != true ]; then
            cat "$LOG" >&2 || true
            exit 1
          fi
          export E2E_REUSE_EXISTING_SERVER=true
          npm run test:e2e

  # GITHUB_TOKEN dispatches the four main validators after PR auto-merge.
  # Their workflow_run callbacks are not a reliable transitive trigger.
  # Dispatch the EXISTING Staging Promote workflow explicitly, from the last
  # successful CI job, after exact-main SHA + the other three validators.
  # No new runner or automation, and staging still checks backup before writes.
  canonical-postmerge-staging-handoff:
    name: Canonical exact-SHA staging handoff
    needs: [impact_scope, lint, typecheck, unit, architecture, build, e2e]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'github-actions[bot]' &&
      needs.impact_scope.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.architecture.result == 'success' &&
      needs.build.result == 'success' &&
      needs.e2e.result == 'success'
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # P2: only this job can dispatch the existing staging workflow.
    steps:
      - name: Checkout immutable validated SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify canonical validators and dispatch existing staging workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/dispatch-staging-after-ci.py
