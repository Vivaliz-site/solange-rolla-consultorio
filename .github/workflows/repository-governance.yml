name: Repository Governance Gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: governance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  governance-gate:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate governance contract
        env:
          AUDIT_LEDGER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AUDIT_LEDGER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/repository-governance-validate.sh ci
